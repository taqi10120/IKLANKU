<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b5fa5">
<meta name="apple-mobile-web-app-title" content="Rekap Iklan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Rekap Iklan</title>
<style>
:root{--bg:#edf0f3;--card:#fff;--tx:#14202b;--mut:#5f6c78;--bd:#d9dfe5;--ac:#0b5fa5;--ok:#13795b;--wr:#a8610a;--bad:#c0332b;--okb:#dff3ec;--wrb:#fbeed8;--badb:#fbe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10171e;--card:#19232d;--tx:#e8edf1;--mut:#93a1ad;--bd:#2a3744;--ac:#5aa9ec;--ok:#4cc79f;--wr:#e5a64f;--bad:#f0776e;--okb:#143528;--wrb:#3a2a12;--badb:#3d1c19}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10171e;--card:#19232d;--tx:#e8edf1;--mut:#93a1ad;--bd:#2a3744;--ac:#5aa9ec;--ok:#4cc79f;--wr:#e5a64f;--bad:#f0776e;--okb:#143528;--wrb:#3a2a12;--badb:#3d1c19}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;letter-spacing:-.2px}
h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.banner small{display:block;font-weight:400;margin-top:2px}
.ok{background:var(--okb);color:var(--ok)}.wr{background:var(--wrb);color:var(--wr)}.bad{background:var(--badb);color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.k span{display:block;color:var(--mut);font-size:12.5px}
.k b{display:block;font-size:18px;margin-top:2px}
.k.big{grid-column:1/3}.k.big b{font-size:24px}
.c-ok{color:var(--ok)}.c-wr{color:var(--wr)}.c-bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .m{color:var(--mut);font-size:13px}
.tag{font-size:12px;border-radius:99px;padding:1px 9px;border:1px solid var(--bd);white-space:nowrap}
.tag.ok{border-color:var(--ok)}.tag.wr{border-color:var(--wr)}.tag.bad{border-color:var(--bad)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.d{color:var(--bad);border-color:var(--bad)}
.add{width:100%;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{min-height:120px;font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:13px 4px;color:var(--mut);font-size:14px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
#sheet.show{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.note{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"><div class="in" id="sin"></div></div>
<script>
(function(){
var KEY='rekapiklan_v1';
var tab='ring';
function seed(){var a=[];for(var i=1;i<=28;i++)a.push({id:i,nama:'Order '+i,tgl:'',metode:i<=4?'Transfer':'COD',subsidi:(i>4&&i<=9)?15000:0,status:i<=14?'Diterima':'Dikirim',retur:0});return a}
var DEF={cfg:{harga:149000,hpp:40000,fee:3.33,ongkir:25000,ppn:11,batas:55000},days:[{id:1,d:'2026-10-26',spend:2604000,lead:42,note:'Agregat 19–26 Okt, angka dashboard sebelum PPN'}],orders:seed(),nid:100};
var S;
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}S=JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rp(n){n=Math.round(n||0);return (n<0?'−':'')+'Rp'+Math.abs(n).toLocaleString('id-ID')}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function marginOf(o){var c=S.cfg;var fee=o.metode==='COD'?c.fee/100*(c.harga+c.ongkir):0;return c.harga-c.hpp-num(o.subsidi)-fee}
function calc(){
 var c=S.cfg,r={};
 r.spendRaw=S.days.reduce(function(a,d){return a+num(d.spend)},0);
 r.spend=r.spendRaw*(1+c.ppn/100);
 r.lead=S.days.reduce(function(a,d){return a+num(d.lead)},0);
 var os=S.orders;
 r.closing=os.filter(function(o){return o.status!=='Batal'}).length;
 var valid=os.filter(function(o){return o.status==='Dikirim'||o.status==='Diterima'});
 r.diterima=os.filter(function(o){return o.status==='Diterima'}).length;
 r.dikirim=os.filter(function(o){return o.status==='Dikirim'}).length;
 r.retur=os.filter(function(o){return o.status==='Retur'}).length;
 r.batal=os.filter(function(o){return o.status==='Batal'}).length;
 r.cod=os.filter(function(o){return o.metode==='COD'&&o.status!=='Batal'}).length;
 r.margin=valid.reduce(function(a,o){return a+marginOf(o)},0);
 r.returCost=os.filter(function(o){return o.status==='Retur'}).reduce(function(a,o){return a+num(o.retur)},0);
 r.profit=r.margin-r.returCost-r.spend;
 r.cpr=r.lead?r.spendRaw/r.lead:0;
 r.roasD=r.spendRaw?r.lead*c.harga/r.spendRaw:0;
 r.roasC=r.spendRaw?r.closing*c.harga/r.spendRaw:0;
 r.cr=r.lead?r.closing/r.lead:0;
 r.avgM=valid.length?r.margin/valid.length:(c.harga-c.hpp);
 r.bep=r.avgM*r.cr/(1+c.ppn/100);
 r.target=r.bep*0.65;
 r.resolved=r.diterima+r.retur;
 r.returRate=r.resolved?r.retur/r.resolved:0;
 return r}
function field(k,label,type,val,opts){
 if(type==='select')return '<label>'+label+'</label><select data-k="'+k+'">'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
 return '<label>'+label+'</label><input data-k="'+k+'" type="'+type+'" '+(type==='number'?'inputmode="decimal" step="any" ':'')+'value="'+e(val)+'">'}
function sheet(title,html,onSave,onDel){
 var s=document.getElementById('sheet'),n=document.getElementById('sin');
 n.innerHTML='<div class="row"><b>'+title+'</b><button id="x">Tutup</button></div>'+html+'<div class="row" style="margin-top:16px"><button class="p" id="sv" style="flex:1">Simpan</button>'+(onDel?'<button class="d" id="dl">Hapus</button>':'')+'</div>';
 s.classList.add('show');
 function close(){s.classList.remove('show')}
 n.querySelector('#x').onclick=close;
 n.querySelector('#sv').onclick=function(){var v={};n.querySelectorAll('[data-k]').forEach(function(i){v[i.getAttribute('data-k')]=i.value});onSave(v);save();close();render()};
 if(onDel){var d=n.querySelector('#dl');d.onclick=function(){if(d.dataset.s!=='1'){d.dataset.s='1';d.textContent='Ketuk lagi untuk hapus';return}onDel();save();close();render()}}
 var st=n.querySelector('[data-k="status"]'),rt=n.querySelector('[data-k="retur"]');
 if(st&&rt)st.onchange=function(){if(st.value==='Retur'&&!num(rt.value))rt.value=S.cfg.ongkir*2}}
function dayForm(d){d=d||{d:new Date().toISOString().slice(0,10),spend:'',lead:'',note:''};
 sheet(d.id?'Ubah data iklan':'Tambah data iklan',field('d','Tanggal','date',d.d)+field('spend','Spend dashboard (sebelum PPN, Rp)','number',d.spend)+field('lead','Jumlah lead','number',d.lead)+field('note','Catatan (opsional)','text',d.note),
 function(v){var o={d:v.d,spend:num(v.spend),lead:num(v.lead),note:v.note};if(d.id){Object.assign(d,o)}else{o.id=S.nid++;S.days.push(o)}},
 d.id?function(){S.days=S.days.filter(function(x){return x.id!==d.id})}:null)}
function ordForm(o){o=o||{nama:'',tgl:new Date().toISOString().slice(0,10),metode:'COD',subsidi:0,status:'Dikirim',retur:0};
 sheet(o.id?'Ubah order':'Tambah closing',field('nama','Nama atau kode order','text',o.nama)+field('tgl','Tanggal closing','date',o.tgl)+field('metode','Metode bayar','select',o.metode,['COD','Transfer'])+field('subsidi','Subsidi ongkir (Rp)','number',o.subsidi)+field('status','Status','select',o.status,['Dikirim','Diterima','Retur','Batal'])+field('retur','Biaya retur jika retur (ongkir pergi-pulang, Rp)','number',o.retur),
 function(v){var n={nama:v.nama||'Order',tgl:v.tgl,metode:v.metode,subsidi:num(v.subsidi),status:v.status,retur:num(v.retur)};if(o.id){Object.assign(o,n)}else{n.id=S.nid++;S.orders.push(n)}},
 o.id?function(){S.orders=S.orders.filter(function(x){return x.id!==o.id})}:null)}
function vRing(){
 var r=calc(),c=S.cfg,h='<h1>Ringkasan</h1>';
 var cls,msg,sub;
 if(!r.lead){cls='wr';msg='Belum ada data lead';sub='Isi tab Harian dulu.'}
 else if(r.cpr>c.batas){cls='bad';msg='Zona bahaya';sub='CPR '+rp(r.cpr)+' di atas batas potong '+rp(c.batas)+'. Rule B: matikan iklan yang melewati batas ini.'}
 else if(r.cpr<=r.target){cls='ok';msg='Aman';sub='CPR '+rp(r.cpr)+' di bawah target '+rp(r.target)+'.'}
 else{cls='wr';msg='Waspada';sub='CPR '+rp(r.cpr)+' di atas target '+rp(r.target)+', belum melewati batas potong. Jangan scale.'}
 h+='<div class="banner '+cls+'">'+msg+'<small>'+sub+'</small></div>';
 h+='<div class="grid"><div class="k big"><span>Profit riil (setelah PPN iklan, subsidi, fee COD, retur)</span><b class="'+(r.profit>=0?'c-ok':'c-bad')+'">'+rp(r.profit)+'</b></div>';
 h+='<div class="k"><span>Spend + PPN</span><b>'+rp(r.spend)+'</b></div><div class="k"><span>Lead / Closing</span><b>'+r.lead+' / '+r.closing+'</b></div>';
 h+='<div class="k"><span>CPR dashboard</span><b>'+rp(r.cpr)+'</b></div><div class="k"><span>Closing rate</span><b>'+(r.cr*100).toFixed(1)+'%</b></div>';
 h+='<div class="k"><span>ROAS dashboard</span><b>'+r.roasD.toFixed(2)+'</b></div><div class="k"><span>ROAS closing nyata</span><b>'+r.roasC.toFixed(2)+'</b></div>';
 h+='<div class="k"><span>CPR impas (BEP)</span><b>'+rp(r.bep)+'</b></div><div class="k"><span>Target CPR (65% BEP)</span><b>'+rp(r.target)+'</b></div></div>';
 h+='<h2>Status paket</h2><div class="grid"><div class="k"><span>Diterima</span><b>'+r.diterima+'</b></div><div class="k"><span>Masih di jalan</span><b>'+r.dikirim+'</b></div><div class="k"><span>Retur</span><b class="'+(r.retur?'c-bad':'')+'">'+r.retur+'</b></div><div class="k"><span>Batal</span><b>'+r.batal+'</b></div><div class="k"><span>Retur dari paket selesai</span><b>'+(r.returRate*100).toFixed(0)+'%</b></div><div class="k"><span>Closing COD</span><b>'+r.cod+' ('+(r.closing?Math.round(r.cod/r.closing*100):0)+'%)</b></div></div>';
 h+='<h2>Rule iklan</h2><div class="card note">Rule A: matikan jika spend ≥ <b>'+rp(r.target*3)+'</b> dan lead 0.<br>Rule B: matikan jika spend ≥ <b>'+rp(r.target*3)+'</b> dan CPR &gt; <b>'+rp(c.batas)+'</b> (ROAS dashboard &lt; <b>'+(c.harga/c.batas).toFixed(2)+'</b>), jendela 3 hari atau lifetime.<br>Pakai ini juga di Meta Automated Rules.</div>';
 h+='<p class="note">Profit dihitung dari paket berstatus Dikirim dan Diterima. Paket yang masih di jalan belum pasti. Setelan biaya ada di tab Setelan.</p>';
 return h}
function vDay(){
 var h='<h1>Data iklan harian</h1><button class="p add" id="addd">+ Tambah data iklan</button>',c=S.cfg;
 if(!S.days.length)h+='<div class="empty">Belum ada data. Tambahkan spend dan lead dari Ads Manager.</div>';
 S.days.slice().sort(function(a,b){return a.d<b.d?1:-1}).forEach(function(d){
  var cpr=num(d.lead)?num(d.spend)/num(d.lead):0,cl=!num(d.lead)?'':cpr>c.batas?'bad':'ok';
  h+='<div class="item" data-d="'+d.id+'"><div class="row"><b>'+e(d.d)+'</b><span class="tag '+cl+'">CPR '+(cpr?rp(cpr):'-')+'</span></div><div class="m">Spend '+rp(d.spend)+' · Lead '+num(d.lead)+(cpr?' · ROAS '+(c.harga/cpr).toFixed(2):'')+'</div>'+(d.note?'<div class="m">'+e(d.note)+'</div>':'')+'</div>'});
 return h}
function vOrd(){
 var h='<h1>Closing dan retur</h1><button class="p add" id="addo">+ Tambah closing</button>',cs={Dikirim:'wr',Diterima:'ok',Retur:'bad',Batal:''};
 if(!S.orders.length)h+='<div class="empty">Belum ada closing.</div>';
 S.orders.slice().reverse().forEach(function(o){
  h+='<div class="item" data-o="'+o.id+'"><div class="row"><b>'+e(o.nama)+'</b><span class="tag '+cs[o.status]+'">'+o.status+'</span></div><div class="m">'+o.metode+(o.tgl?' · '+e(o.tgl):'')+(num(o.subsidi)?' · subsidi '+rp(o.subsidi):'')+(o.status==='Retur'?' · biaya retur '+rp(o.retur):'')+'</div></div>'});
 return h}
function vSet(){
 var c=S.cfg;
 return '<h1>Setelan</h1><div class="card"><b>Biaya dan harga</b>'+field('harga','Harga jual (Rp)','number',c.harga)+field('hpp','HPP (Rp)','number',c.hpp)+field('ongkir','Rata-rata ongkir (Rp, dasar fee COD dan biaya retur)','number',c.ongkir)+field('fee','Fee COD (%)','number',c.fee)+field('ppn','PPN iklan (%)','number',c.ppn)+field('batas','Batas potong CPR (Rp)','number',c.batas)+'<button class="p" id="svc" style="margin-top:14px;width:100%">Simpan setelan</button></div>'+
 '<div class="card"><b>Cadangan data</b><p class="note">Data tersimpan di browser HP ini saja. Salin teks di bawah sebagai cadangan, atau tempel teks cadangan lalu Pulihkan.</p><textarea id="bk"></textarea><div class="row" style="margin-top:8px"><button id="ex" style="flex:1">Tampilkan cadangan</button><button id="im" style="flex:1">Pulihkan</button></div><p class="note" id="bm"></p></div>'}
function render(){
 var a=document.getElementById('app');
 a.innerHTML=tab==='ring'?vRing():tab==='day'?vDay():tab==='ord'?vOrd():vSet();
 var nv=[['ring','Ringkasan'],['day','Harian'],['ord','Order'],['set','Setelan']];
 document.getElementById('nav').innerHTML=nv.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
 document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render();window.scrollTo(0,0)}});
 var q=function(s){return a.querySelector(s)};
 if(q('#addd'))q('#addd').onclick=function(){dayForm()};
 if(q('#addo'))q('#addo').onclick=function(){ordForm()};
 a.querySelectorAll('[data-d]').forEach(function(i){i.onclick=function(){dayForm(S.days.filter(function(x){return x.id==i.dataset.d})[0])}});
 a.querySelectorAll('[data-o]').forEach(function(i){i.onclick=function(){ordForm(S.orders.filter(function(x){return x.id==i.dataset.o})[0])}});
 if(q('#svc'))q('#svc').onclick=function(){a.querySelectorAll('[data-k]').forEach(function(i){S.cfg[i.getAttribute('data-k')]=num(i.value)});save();var b=q('#svc');b.textContent='Tersimpan';setTimeout(function(){render()},700)};
 if(q('#ex'))q('#ex').onclick=function(){var t=q('#bk');t.value=JSON.stringify(S);t.focus();t.select();q('#bm').textContent='Salin seluruh teks di kotak ini dan simpan di catatan atau WhatsApp kamu sendiri.'};
 if(q('#im'))q('#im').onclick=function(){try{var o=JSON.parse(q('#bk').value);if(!o.cfg||!o.days||!o.orders)throw 0;S=o;save();tab='ring';render()}catch(x){q('#bm').textContent='Teks cadangan tidak valid. Tempel teks lengkap dari hasil Tampilkan cadangan.'}}}
load();render();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(x){}
})();
</script>
</body>
</html>
